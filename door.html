<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="開門">
<title>開門控制台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  :root {
    --bg1: #1b1f2b;
    --bg2: #262c3d;
    --panel: rgba(255,255,255,0.05);
    --panel-border: rgba(255,255,255,0.1);
    --orange: #ff8c3a;
    --red: #ff4444;
    --green: #35e28a;
    --amber: #ffc247;
    --text: #f5f6f8;
    --muted: #9296a3;
  }

  html, body { height: 100%; }

  body {
    background: linear-gradient(160deg, var(--bg1), var(--bg2) 60%, #202535);
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 20px 0 28px;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
  }

  .flash-overlay {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }
  .flash-overlay.on { animation: flash 0.5s ease-out; }
  @keyframes flash {
    0% { opacity: 0; }
    8% { opacity: 0.85; }
    100% { opacity: 0; }
  }

  .console {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 2;
  }
  .console.shake { animation: shake 0.45s ease-in-out; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(-6px,3px); }
    20% { transform: translate(5px,-4px); }
    30% { transform: translate(-5px,2px); }
    40% { transform: translate(6px,3px); }
    50% { transform: translate(-4px,-3px); }
    60% { transform: translate(4px,2px); }
    70% { transform: translate(-3px,-2px); }
    80% { transform: translate(2px,2px); }
    90% { transform: translate(-2px,0); }
  }

  .padded { padding: 0 16px; width: 100%; }

  .titlebar {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
  }
  .titlebar .live { display: flex; align-items: center; gap: 6px; color: var(--orange); }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--orange);
    animation: livePulse 1.4s infinite;
  }
  @keyframes livePulse {
    0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,140,58,0.6); }
    50% { opacity: 0.5; box-shadow: 0 0 0 5px rgba(255,140,58,0); }
  }

  .header { text-align: center; }
  .header h1 {
    font-size: 22px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    background: linear-gradient(135deg, #fff, #ffd9b0 60%, var(--orange));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .header p {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted);
    letter-spacing: 0.12em; margin-top: 6px;
  }

  .status-panel {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
  }
  .status-item { display: flex; align-items: center; gap: 8px; }
  .status-led {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: all 0.3s;
  }
  .status-led.connecting { background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: blink 1s infinite; }
  .status-led.connected { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .status-led.error { background: var(--red); box-shadow: 0 0 10px var(--red); animation: blink 0.5s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  .status-text { font-weight: 500; letter-spacing: 0.1em; color: var(--muted); }
  .status-text.connected { color: var(--green); }
  .status-text.error { color: var(--red); }

  /* 目標指示卡 */
  .target-card {
    background: linear-gradient(135deg, rgba(255,140,58,0.16), rgba(255,68,68,0.07));
    border: 1px solid rgba(255,140,58,0.4);
    border-radius: 10px;
    padding: 14px 18px;
    text-align: center;
  }
  .target-card .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--orange);
    margin-bottom: 4px;
  }
  .target-card .target-value {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #fff;
  }

  /* 圖片區：滿版齊寬 */
  .photo-wrap {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-top: 1px solid rgba(255,140,58,0.3);
    border-bottom: 1px solid rgba(255,140,58,0.3);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .photo-wrap img {
    display: block;
    width: 100%;
    height: auto;
  }

  .cell-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }

  .cell {
    position: relative;
    cursor: pointer;
  }
  .cell:active {
    background: rgba(255,255,255,0.1);
  }

  .cell-mark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    opacity: 0;
    pointer-events: none;
  }
  .cell-mark.show-wrong {
    animation: markPop 0.5s ease-out;
    color: var(--red);
    text-shadow: 0 0 12px rgba(255,68,68,0.9);
  }
  .cell-mark.show-correct {
    animation: markPop 0.6s ease-out;
    color: var(--green);
    text-shadow: 0 0 16px rgba(53,226,138,0.9);
  }
  @keyframes markPop {
    0% { opacity: 0; transform: scale(0.4); }
    35% { opacity: 1; transform: scale(1.15); }
    100% { opacity: 0; transform: scale(1); }
  }

  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-align: center;
    min-height: 16px;
  }
  .hint.warn { color: var(--amber); }
  .hint.success { color: var(--green); }
  .hint.error { color: var(--red); }

  .footer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #565c6b;
    letter-spacing: 0.1em;
    text-align: center;
  }

  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 6px var(--orange);
    opacity: 0;
  }
  .particle.go { animation: particleBurst 0.9s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes particleBurst {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(0.3); }
  }
</style>
</head>

<script>
const BROKER = 'wss://a48d74ed775840a390ab0dae8e04b2ae.s1.eu.hivemq.cloud:8884/mqtt';
const USER = 'chaselist';
const PASS = 'Newnows_14';
const TOPIC = 'home/door';

// 由左至右、由上至下對應12個格子
const PLAYERS = [
  '郭俊麟', '蘇智傑', '林佳緯', '陳傑憲', '陳重羽', '髙塩將樹',
  '陳聖平', '張皓崴', '江少慶', '陳鏞基', '潘傑楷', '林泓弦'
];

const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const hint = document.getElementById('hint');
const targetValue = document.getElementById('targetValue');
const cellGrid = document.getElementById('cellGrid');
const consoleEl = document.getElementById('console');
const flashOverlay = document.getElementById('flashOverlay');
const particlesEl = document.getElementById('particles');

let target = null;
let client, connected = false, locked = false;

function setStatus(state, text) {
  dot.className = 'status-led ' + state;
  statusText.className = 'status-text ' + state;
  statusText.textContent = text;
}

function setHint(msg, cls = '') {
  hint.textContent = msg;
  hint.className = 'hint' + (cls ? ' ' + cls : '');
}

function pickTarget() {
  target = Math.floor(Math.random() * PLAYERS.length);
  targetValue.textContent = PLAYERS[target];
  locked = false;
  setHint('請點擊指定的球員');
}

function buildGrid() {
  for (let i = 0; i < PLAYERS.length; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;

    const mark = document.createElement('div');
    mark.className = 'cell-mark';
    cell.appendChild(mark);

    cell.addEventListener('click', () => handleClick(i, cell, mark));
    cellGrid.appendChild(cell);
  }
}

function spawnParticles(x, y) {
  const count = 16;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
    const dist = 70 + Math.random() * 50;
    p.style.setProperty('--px', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--py', Math.sin(angle) * dist + 'px');
    particlesEl.appendChild(p);
    requestAnimationFrame(() => p.classList.add('go'));
  }
  setTimeout(() => { particlesEl.innerHTML = ''; }, 1000);
}

function handleClick(index, cell, mark) {
  if (locked) return;
  if (!connected) {
    setHint('尚未連線，請稍候', 'error');
    return;
  }

  if (index === target) {
    locked = true;
    mark.textContent = '✓';
    mark.classList.add('show-correct');
    const rect = cell.getBoundingClientRect();
    spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
    consoleEl.classList.add('shake');
    flashOverlay.classList.add('on');
    setHint('身份確認，開門中...', 'success');

    setTimeout(() => {
      consoleEl.classList.remove('shake');
      flashOverlay.classList.remove('on');
    }, 600);

    client.publish(TOPIC, 'open', { qos: 1 }, (err) => {
      if (err) {
        setHint('發送失敗，請重試', 'error');
      } else {
        setHint('✓ 開門指令已送出', 'success');
      }
      setTimeout(() => { pickTarget(); }, 2000);
    });
  } else {
    mark.textContent = '✕';
    mark.classList.remove('show-wrong');
    void mark.offsetWidth;
    mark.classList.add('show-wrong');
    setHint('目標錯誤，請重新確認', 'error');
  }
}

function connect() {
  setStatus('connecting', 'CONNECTING');
  client = mqtt.connect(BROKER, {
    username: USER,
    password: PASS,
    clientId: 'door_' + Math.random().toString(16).substr(2, 8),
    reconnectPeriod: 3000,
  });

  client.on('connect', () => {
    connected = true;
    setStatus('connected', 'ONLINE');
  });
  client.on('error', () => {
    connected = false;
    setStatus('error', 'OFFLINE');
  });
  client.on('offline', () => {
    connected = false;
    setStatus('connecting', 'RECONNECTING');
  });
}

buildGrid();
pickTarget();
connect();
</script>
