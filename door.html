<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="開門">
<meta name="theme-color" content="#16181f">
<title>開門</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #16181f; --card: #222631; --line: #343a48;
    --orange: #ff8a2a; --green: #2fd67b; --red: #ff4d4d; --amber: #ffbf3c;
    --text: #f4f5f7; --muted: #9aa0ad;
  }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    min-height: 100vh; min-height: 100dvh;
    padding: max(10px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none;
  }
  .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

  /* 狀態列 */
  .status { display: flex; gap: 8px; }
  .pill {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 10px; font-size: 15px; color: var(--muted); white-space: nowrap;
  }
  .pill b { color: var(--text); font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.wait { background: var(--amber); animation: blink 1s infinite; }
  .dot.bad { background: var(--red); box-shadow: 0 0 8px var(--red); }
  @keyframes blink { 50% { opacity: .3; } }

  .banner {
    display: none; background: rgba(255,77,77,.12); border: 1px solid var(--red); color: #ffd0d0;
    border-radius: 12px; padding: 10px 14px; font-size: 15px; text-align: center;
  }
  .banner.show { display: block; }

  /* 題目 */
  .prompt {
    background: linear-gradient(135deg, rgba(255,138,42,.22), rgba(255,138,42,.06));
    border: 2px solid var(--orange); border-radius: 18px;
    padding: 8px 16px 10px; text-align: center;
  }
  .prompt .small { font-size: 16px; color: #ffd9b8; }
  .prompt .name { font-size: 36px; font-weight: 800; letter-spacing: .04em; line-height: 1.2; margin-top: 2px; }

  /* 球員格子 */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile {
    position: relative; border-radius: 14px; overflow: hidden; cursor: pointer;
    aspect-ratio: 1 / 0.97; background: #000; border: 3px solid transparent;
    transition: transform .12s, border-color .2s;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .tile:active { transform: scale(.96); }
  .tile.wrong { border-color: var(--red); animation: shake .4s; }
  .tile.right { border-color: var(--green); }
  .tile .mark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 900; opacity: 0; pointer-events: none;
  }
  .tile.wrong .mark { opacity: 1; color: var(--red); background: rgba(0,0,0,.45); }
  .tile.right .mark { opacity: 1; color: var(--green); background: rgba(0,0,0,.35); }
  @keyframes shake { 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

  .hint { text-align: center; font-size: 17px; color: var(--muted); min-height: 24px; }
  .hint.bad { color: var(--red); }

  /* 開門結果全螢幕 */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(10,12,16,.92); text-align: center; padding: 24px;
  }
  .overlay.show { display: flex; }
  .overlay .icon { font-size: 110px; line-height: 1; }
  .overlay .title { font-size: 38px; font-weight: 800; }
  .overlay .sub { font-size: 18px; color: var(--muted); max-width: 320px; }
  .overlay.sending .title { color: var(--amber); }
  .overlay.opened .title { color: var(--green); }
  .overlay.warn .title { color: var(--red); }
  .overlay.sending .icon { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(.9); opacity: .6; } }
  .overlay button {
    margin-top: 10px; font-size: 20px; padding: 12px 34px; border-radius: 999px; border: none;
    background: var(--card); color: var(--text); border: 1px solid var(--line);
  }
</style>
</head>

<div class="wrap">

</div>

</div>

const $ = id => document.getElementById(id);
let client, connected = false, deviceOnline = null, target = -1, busy = false, waitTimer = null, lastSeen = 0;

function setDevice(online) {
  deviceOnline = online;
  setPill('devDot', 'devText', online ? 'ok' : 'bad', online ? '在線' : '離線');
  updateBanner();
}

// 門鎖每 60 秒回報一次；超過 3 分鐘沒回報就當作離線
setInterval(() => {
  if (connected && deviceOnline && lastSeen && Date.now() - lastSeen > 180000) setDevice(false);
}, 15000);

function setPill(dotId, textId, state, text) {
  $(dotId).className = 'dot ' + state;
  $(textId).textContent = text;
}

function updateBanner() {
  $('banner').classList.toggle('show', connected && deviceOnline === false);
}

function pickTarget() {
  let t;
  do { t = Math.floor(Math.random() * PLAYERS.length); } while (t === target);
  target = t;
  $('targetName').textContent = PLAYERS[target];
  setHint('點對人就會開門');
}

function setHint(msg, bad) {
  $('hint').textContent = msg;
  $('hint').className = 'hint' + (bad ? ' bad' : '');
}

function buildGrid() {
  PHOTOS.forEach((src, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = `<img src="${src}" alt=""><div class="mark"></div>`;
    tile.addEventListener('click', () => onTap(i, tile));
    $('grid').appendChild(tile);
  });
}

function onTap(i, tile) {
  if (busy) return;
  const mark = tile.querySelector('.mark');
  if (!connected) { setHint('還沒連上，請稍等一下', true); return; }

  if (i !== target) {
    mark.textContent = '✕';
    tile.classList.remove('wrong'); void tile.offsetWidth; tile.classList.add('wrong');
    setHint('不是他喔，再找找看', true);
    if (navigator.vibrate) navigator.vibrate(120);
    setTimeout(() => tile.classList.remove('wrong'), 700);
    return;
  }

  busy = true;
  mark.textContent = '✓';
  tile.classList.add('right');
  if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
  showOverlay('sending', '🔓', '開門中…', '');

  client.publish(T_CMD, 'open', { qos: 1 }, err => {
    if (err) { showOverlay('warn', '⚠️', '送出失敗', '網路有問題，請再試一次', true); return; }
    // 等門鎖回報「opened」
    waitTimer = setTimeout(() => {
      showOverlay('warn', '⚠️', '門鎖沒有回應', '指令已送出，但門鎖沒有確認。可能離線或接線有問題。', true);
    }, 6000);
  });
}

function showOverlay(state, icon, title, sub, needBtn) {
  const ov = $('overlay');
  ov.className = 'overlay show ' + state;
  $('ovIcon').textContent = icon;
  $('ovTitle').textContent = title;
  $('ovSub').textContent = sub;
  $('ovBtn').style.display = needBtn ? '' : 'none';
}

function closeOverlay() {
  clearTimeout(waitTimer);
  $('overlay').className = 'overlay';
  document.querySelectorAll('.tile.right').forEach(t => t.classList.remove('right'));
  busy = false;
  pickTarget();
}
$('ovBtn').addEventListener('click', closeOverlay);

function onDeviceEvent(msg) {
  if (!busy) return;
  clearTimeout(waitTimer);
  if (msg === 'opened') {
    showOverlay('opened', '✅', '門已打開', '請進！');
    if (navigator.vibrate) navigator.vibrate(200);
    setTimeout(closeOverlay, 2500);
  } else if (msg === 'cooldown') {
    showOverlay('warn', '⏳', '剛剛才開過', '門已經在開了，3 秒後可再按一次', true);
  }
}

function connect() {
  setPill('netDot', 'netText', 'wait', '連線中');
  client = mqtt.connect(BROKER, {
    username: USER, password: PASS,
    clientId: 'web_' + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000,
  });
  client.on('connect', () => {
    connected = true;
    setPill('netDot', 'netText', 'ok', '正常');
    client.subscribe([T_STATUS, T_EVENT, T_HEARTBEAT, T_PONG]);
    client.publish('home/door/ping', 'web');
    updateBanner();
  });
  client.on('message', (topic, payload) => {
    const msg = payload.toString().trim();
    if (topic === T_STATUS) {
      // 保留的 offline 可能是舊連線留下的；最近 2 分鐘內有收到回報就不理它
      if (msg === 'online') { lastSeen = Date.now(); setDevice(true); }
      else if (!(lastSeen && Date.now() - lastSeen < 120000)) setDevice(false);
    } else {
      // 收到門鎖的任何回報（heartbeat / pong / event）都代表它在線
      lastSeen = Date.now();
      setDevice(true);
      if (topic === T_EVENT) onDeviceEvent(msg);
    }
  });
  client.on('offline', () => {
    connected = false;
    setPill('netDot', 'netText', 'wait', '重新連線');
    updateBanner();
  });
  client.on('error', () => {
    connected = false;
    setPill('netDot', 'netText', 'bad', '失敗');
  });
}

buildGrid();
pickTarget();
connect();
</script>
</body>
</html>
