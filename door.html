<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="開門">
<meta name="theme-color" content="#eaf3ff">
<title>開門</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --blue: #2f7cf6; --blue-dark: #1d4f9e; --blue-soft: #dbe9ff; --sky: #eaf3ff;
    --white: #ffffff; --red: #ff3b5c; --green: #22b573; --amber: #f5a623; --muted: #6b7a90;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(180deg, var(--sky) 0%, #ffffff 70%);
    color: var(--blue-dark);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  .app {
    height: 100vh; height: 100dvh; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }

  /* 狀態列 */
  .status { display: flex; gap: 8px; }
  .pill {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--white); border: 1.5px solid var(--blue-soft); border-radius: 999px;
    padding: 8px 10px; font-size: 15px; color: var(--muted); white-space: nowrap;
    box-shadow: 0 2px 8px rgba(47,124,246,.08);
  }
  .pill b { color: var(--blue-dark); font-weight: 700; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c3cddb; flex: none; }
  .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.wait { background: var(--amber); animation: blink 1s infinite; }
  .dot.bad { background: var(--red); box-shadow: 0 0 6px var(--red); }
  @keyframes blink { 50% { opacity: .3; } }
  .banner {
    display: none; margin-top: 10px; background: #fff0f2; border: 1.5px solid var(--red); color: #c4203d;
    border-radius: 12px; padding: 9px 14px; font-size: 15px; text-align: center;
  }
  .banner.show { display: block; }

  /* 舞台：愛心在上、角色在下 */
  .stage { position: relative; flex: 1; margin-top: 10px; touch-action: none; }
  .heart {
    position: absolute; left: 50%; top: 6%; width: 120px; height: 120px; transform: translateX(-50%);
    display: flex; align-items: center; justify-content: center;
  }
  .heart::before {
    content: ""; position: absolute; inset: -30px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,59,92,.45) 0%, rgba(255,59,92,.15) 45%, rgba(255,59,92,0) 70%);
    animation: glow 1.8s ease-in-out infinite;
  }
  .heart svg { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 6px 14px rgba(255,59,92,.45)); animation: beat 1.8s ease-in-out infinite; }
  @keyframes glow { 50% { transform: scale(1.15); opacity: .7; } }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.08); } 30% { transform: scale(.98); } 45% { transform: scale(1.05); } }
  .heart.near::before { animation-duration: .6s; background: radial-gradient(circle, rgba(255,59,92,.7) 0%, rgba(255,59,92,.25) 50%, rgba(255,59,92,0) 72%); }
  .heart.near svg { animation-duration: .6s; }

  .trail {
    position: absolute; left: 50%; top: calc(6% + 135px); bottom: 190px; width: 0;
    border-left: 3px dashed rgba(47,124,246,.35); transform: translateX(-50%);
  }
  .hint {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    text-align: center; font-size: 20px; font-weight: 700; color: var(--blue);
    pointer-events: none;
  }
  #hintText { background: rgba(255,255,255,.85); padding: 6px 14px; border-radius: 999px; }
  .hint.bad { color: var(--red); }
  .arrow { display: block; font-size: 26px; margin-bottom: 6px; animation: up 1.4s ease-in-out infinite; }
  @keyframes up { 0%,100% { transform: translateY(6px); opacity: .5; } 50% { transform: translateY(-6px); opacity: 1; } }

  .pup {
    position: absolute; left: 50%; bottom: 10px; width: 150px; height: 170px;
    margin-left: -75px; cursor: grab; touch-action: none; will-change: transform;
  }
  .pup svg { width: 100%; height: 100%; pointer-events: none; filter: drop-shadow(0 8px 12px rgba(29,79,158,.18)); }
  .pup.dragging { cursor: grabbing; }
  .pup.back { transition: transform .35s cubic-bezier(.3,1.5,.6,1); }

  /* 結果畫面 */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(234,243,255,.95); text-align: center; padding: 24px;
  }
  .overlay.show { display: flex; }
  .overlay .icon { font-size: 104px; line-height: 1; }
  .overlay .title { font-size: 36px; font-weight: 800; }
  .overlay .sub { font-size: 18px; color: var(--muted); max-width: 320px; }
  .overlay.sending .title { color: var(--blue); }
  .overlay.sending .icon { animation: pulse 1s infinite; }
  .overlay.opened .title { color: var(--green); }
  .overlay.warn .title { color: var(--red); }
  @keyframes pulse { 50% { transform: scale(.9); opacity: .6; } }
  .overlay button {
    margin-top: 8px; font-size: 20px; padding: 12px 36px; border-radius: 999px; border: none;
    background: var(--blue); color: #fff; box-shadow: 0 4px 12px rgba(47,124,246,.35);
  }
</style>
</head>
<body>
<div class="app">
  <div class="status">
    <div class="pill"><span class="dot wait" id="netDot"></span>連線 <b id="netText">連線中</b></div>
    <div class="pill"><span class="dot wait" id="devDot"></span>門鎖 <b id="devText">確認中</b></div>
  </div>
  <div class="banner" id="banner">⚠️ 門鎖裝置離線，現在拖可能打不開</div>

  <div class="stage" id="stage">
    <div class="heart" id="heart">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff6b86"/><stop offset="1" stop-color="#e8173d"/>
          </linearGradient>
        </defs>
        <path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 21 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="url(#hg)"/>
        <ellipse cx="30" cy="27" rx="9" ry="6" fill="#fff" opacity=".45" transform="rotate(-30 30 27)"/>
      </svg>
    </div>
    <div class="trail"></div>
    <div class="hint" id="hint"><span class="arrow">⬆</span><span id="hintText">把小狗拖到愛心就會開門</span></div>

    <div class="pup" id="pup" aria-label="拖曳到愛心開門">
      <!-- 原創角色：戴藍色毛帽的白色小狗 -->
      <svg viewBox="0 0 150 170">
        <g stroke="#1f2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
          <!-- 手 -->
          <path d="M30 98 C14 92 8 80 12 72 C16 66 24 70 28 78 C30 84 34 90 40 92" fill="#fff"/>
          <path d="M120 98 C136 92 142 80 138 72 C134 66 126 70 122 78 C120 84 116 90 110 92" fill="#fff"/>
          <!-- 身體 -->
          <path d="M40 92 C34 120 38 150 75 152 C112 150 116 120 110 92 Z" fill="#fff"/>
          <!-- 腳 -->
          <ellipse cx="55" cy="150" rx="17" ry="12" fill="#fff"/>
          <ellipse cx="95" cy="150" rx="17" ry="12" fill="#fff"/>
          <!-- 頭 -->
          <ellipse cx="75" cy="68" rx="42" ry="36" fill="#fff"/>
          <!-- 耳朵 -->
          <path d="M36 56 C22 62 20 88 32 96 C40 98 42 84 42 72" fill="#fff"/>
          <path d="M114 56 C128 62 130 88 118 96 C110 98 108 84 108 72" fill="#fff"/>
          <!-- 藍色毛帽 -->
          <path d="M38 50 C40 22 110 22 112 50 Z" fill="#2f7cf6"/>
          <rect x="34" y="44" width="82" height="14" rx="7" fill="#1d5fd0"/>
          <circle cx="75" cy="22" r="8" fill="#ffffff"/>
        </g>
        <!-- 臉 -->
        <g fill="#1f2a44">
          <ellipse cx="60" cy="72" rx="4" ry="5"/>
          <ellipse cx="90" cy="72" rx="4" ry="5"/>
          <ellipse cx="75" cy="83" rx="6" ry="4.5"/>
        </g>
        <path d="M66 90 C70 96 80 96 84 90" stroke="#1f2a44" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="52" cy="84" rx="6" ry="3.5" fill="#ffb3c1" opacity=".8"/>
        <ellipse cx="98" cy="84" rx="6" ry="3.5" fill="#ffb3c1" opacity=".8"/>
      </svg>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="icon" id="ovIcon">🔓</div>
  <div class="title" id="ovTitle">開門中…</div>
  <div class="sub" id="ovSub"></div>
  <button id="ovBtn" style="display:none">好</button>
</div>

<script>
const BROKER = 'wss://a48d74ed775840a390ab0dae8e04b2ae.s1.eu.hivemq.cloud:8884/mqtt';
const USER = 'chaselist';
const PASS = 'Newnows_14';
const T_CMD = 'home/door';
const T_STATUS = 'home/door/status';
const T_EVENT = 'home/door/event';
const T_HEARTBEAT = 'home/door/heartbeat';
const T_PONG = 'home/door/pong';

const $ = id => document.getElementById(id);
let client, connected = false, deviceOnline = null, busy = false, waitTimer = null, lastSeen = 0;

/* ---------- 狀態 ---------- */
function setPill(dotId, textId, state, text) {
  $(dotId).className = 'dot ' + state;
  $(textId).textContent = text;
}
function updateBanner() {
  $('banner').classList.toggle('show', connected && deviceOnline === false);
}
function setDevice(online) {
  deviceOnline = online;
  setPill('devDot', 'devText', online ? 'ok' : 'bad', online ? '在線' : '離線');
  updateBanner();
}
// 門鎖每 60 秒回報一次；超過 3 分鐘沒回報就當作離線
setInterval(() => {
  if (connected && deviceOnline && lastSeen && Date.now() - lastSeen > 180000) setDevice(false);
}, 15000);

function setHint(msg, bad) {
  $('hintText').textContent = msg;
  $('hint').classList.toggle('bad', !!bad);
}

/* ---------- 拖曳 ---------- */
const pup = $('pup'), heart = $('heart'), stage = $('stage');
let drag = null;

function center(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
function isNearHeart() {
  const a = center(pup), b = center(heart);
  return Math.hypot(a.x - b.x, a.y - b.y) < 90;
}
function moveTo(dx, dy) {
  pup.style.transform = `translate(${dx}px, ${dy}px)`;
}
function goHome() {
  pup.classList.add('back');
  moveTo(0, 0);
  heart.classList.remove('near');
  setTimeout(() => pup.classList.remove('back'), 400);
}

pup.addEventListener('pointerdown', e => {
  if (busy) return;
  pup.setPointerCapture(e.pointerId);
  pup.classList.remove('back');
  pup.classList.add('dragging');
  drag = { x: e.clientX, y: e.clientY };
  if (!connected) setHint('還沒連上，請稍等一下', true);
});
pup.addEventListener('pointermove', e => {
  if (!drag) return;
  moveTo(e.clientX - drag.x, e.clientY - drag.y);
  const near = isNearHeart();
  if (near !== heart.classList.contains('near')) {
    heart.classList.toggle('near', near);
    if (connected) setHint(near ? '放開就會開門 💙' : '把小狗拖到愛心就會開門');
  }
});
function endDrag() {
  if (!drag) return;
  drag = null;
  pup.classList.remove('dragging');
  if (isNearHeart() && connected && !busy) {
    openDoor();
  } else {
    if (connected) setHint('再往上一點，碰到愛心喔', true);
    goHome();
    setTimeout(() => setHint('把小狗拖到愛心就會開門'), 1800);
  }
}
pup.addEventListener('pointerup', endDrag);
pup.addEventListener('pointercancel', endDrag);

/* ---------- 開門 ---------- */
function openDoor() {
  busy = true;
  if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
  showOverlay('sending', '🔓', '開門中…', '');
  client.publish(T_CMD, 'open', { qos: 1 }, err => {
    if (err) { showOverlay('warn', '⚠️', '送出失敗', '網路有問題，請再試一次', true); return; }
    waitTimer = setTimeout(() => {
      showOverlay('warn', '⚠️', '門鎖沒有回應', '指令已送出，但門鎖沒有確認。可能離線或接線有問題。', true);
    }, 6000);
  });
}
function showOverlay(state, icon, title, sub, needBtn) {
  $('overlay').className = 'overlay show ' + state;
  $('ovIcon').textContent = icon;
  $('ovTitle').textContent = title;
  $('ovSub').textContent = sub;
  $('ovBtn').style.display = needBtn ? '' : 'none';
}
function closeOverlay() {
  clearTimeout(waitTimer);
  $('overlay').className = 'overlay';
  busy = false;
  goHome();
  setHint('把小狗拖到愛心就會開門');
}
$('ovBtn').addEventListener('click', closeOverlay);

function onDeviceEvent(msg) {
  if (!busy) return;
  clearTimeout(waitTimer);
  if (msg === 'opened') {
    showOverlay('opened', '💙', '門已打開', '歡迎回家！');
    if (navigator.vibrate) navigator.vibrate(200);
    setTimeout(closeOverlay, 2500);
  } else if (msg === 'cooldown') {
    showOverlay('warn', '⏳', '剛剛才開過', '門已經在開了，3 秒後可再試一次', true);
  }
}

/* ---------- MQTT ---------- */
function connect() {
  setPill('netDot', 'netText', 'wait', '連線中');
  client = mqtt.connect(BROKER, {
    username: USER, password: PASS,
    clientId: 'web_' + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000,
  });
  client.on('connect', () => {
    connected = true;
    setPill('netDot', 'netText', 'ok', '正常');
    client.subscribe([T_STATUS, T_EVENT, T_HEARTBEAT, T_PONG]);
    client.publish('home/door/ping', 'web');
    updateBanner();
    setHint('把小狗拖到愛心就會開門');
  });
  client.on('message', (topic, payload) => {
    const msg = payload.toString().trim();
    if (topic === T_STATUS) {
      // 保留的 offline 可能是舊連線留下的；最近 2 分鐘內有收到回報就不理它
      if (msg === 'online') { lastSeen = Date.now(); setDevice(true); }
      else if (!(lastSeen && Date.now() - lastSeen < 120000)) setDevice(false);
    } else {
      lastSeen = Date.now();
      setDevice(true);
      if (topic === T_EVENT) onDeviceEvent(msg);
    }
  });
  client.on('offline', () => {
    connected = false;
    setPill('netDot', 'netText', 'wait', '重新連線');
    updateBanner();
  });
  client.on('error', () => {
    connected = false;
    setPill('netDot', 'netText', 'bad', '失敗');
  });
}

connect();
</script>
</body>
</html>
